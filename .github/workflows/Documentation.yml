name: Documentation

# Builds the Documenter site in docs/ and deploys it to the gh-pages branch:
# dev/ from main, a versioned directory (and stable/) from each tag, and
# previews/PR<n>/ from pull requests in this repository. Doctests run in
# makedocs, on the CPU backend, against the library from nlolib_jll.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
